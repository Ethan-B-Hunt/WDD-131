<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kids Read For Fun</h1>

        <nav class="main-nav">
            <a href="#">About</a>
            <a href="#">Archive</a>
            <a href="#">Search</a>
        </nav>
    </header>

    <main class="content-container">
        <article class="book-review">
      
            <section class="book-meta">
                <time datetime="2022-07-05" class="post-date">July 5, 2022</time>
                <p class="age-range">10–14</p>
                <p class="genre">Fantasy</p>
            
                <div class="rating" aria-label="Rating: 4 out of 5 stars">
                    <span class="star filled">★★★★</span>
                </div>
            </section>

            <section class="book-detail">
                <h2 class="book-title">Septimus Heap Book One: Magyk</h2>
        
                <div class="cover-wrapper">
                    <img 
                        src='https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg' 
                        alt="Septimus Heap Book One: Magyk book cover" 
                        class="book-cover">
                </div>

                <p class="book-description">
                    If you enjoy stories about seventh sons of seventh sons and magyk, this is the book for you.
                </p>
                <hr>
                <p class="reviewer-name">Jane Doe</p>
            </section>

        </article>
    </main>
</body>
</html>
