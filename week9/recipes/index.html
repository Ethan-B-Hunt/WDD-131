<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic tags always go first -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <meta name="description" content="A simple recipe book with easy.">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="A simple recipe book with easy.">
    <meta property="og:url" content="https://ethan-b-hunt.github.io/WDD-131/week9/recipes/index.html">
    <meta property="og:image" content="https://ethan-b-hunt.github.io/WDD-131/week9/recipes/img/social-preview.png">

    <!-- X (Twitter) Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="A simple recipe book with easy.">
    <meta name="twitter:image" content="https://ethan-b-hunt.github.io/WDD-131/week9/recipes/img/social-preview.png">

    <!-- Favicon and Apple touch icon (relative paths, no leading slash) -->
    <link rel="icon" href="img/recipe-book.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

    <!-- Font for the "RecipeBook" title and recipe name -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="recipes.css">
</head>

<body>
    <header>
        <img src="img/recipe-book.png" alt="Recipe book logo" class="logo">
        <h1>RecipeBook</h1>
    </header>

    <form class="search" role="search">
        <input type="search" placeholder="Find a recipe" aria-label="Find a recipe">
        <button type="submit" aria-label="Search">
            <img src="img/search.svg" alt="search">
        </button>
    </form>

    <main>
        <article class="recipe">
            <img src="img/apple-crisp.jpg" alt="Apple crisp topped with vanilla ice cream" class="recipe-img">

            <div class="recipe-info">
                <span class="tag">dessert</span>
                <h2>Apple Crisp</h2>
                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
            </div>
        </article>
    </main>

    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
            <a href="#"><img src="img/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="img/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="img/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
    </footer>
</body>
</html>
